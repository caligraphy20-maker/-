<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>我的网址导航</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    header {
      padding: 60px 20px 35px;
      text-align: center;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }

    header p {
      margin: 0;
      opacity: 0.85;
    }

    .search-box {
      max-width: 600px;
      margin: 25px auto 0;
    }

    .search-box input {
      width: 100%;
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .category {
      margin-bottom: 38px;
    }

    .category h2 {
      font-size: 22px;
      margin-bottom: 16px;
      border-left: 5px solid #6366f1;
      padding-left: 12px;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
    }

    .link-card {
      display: block;
      padding: 18px;
      background: white;
      border-radius: 14px;
      text-decoration: none;
      color: #222;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      transition: 0.2s;
    }

    .link-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
    }

    .link-card h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .link-card p {
      margin: 0;
      font-size: 14px;
      color: #777;
    }

    .hidden {
      display: none;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>我的网址导航</h1>
  <p>集中管理工作、学习和生活中常用的网站</p>

  <div class="search-box">
    <input
      id="searchInput"
      type="text"
      placeholder="搜索网站名称或描述"
    >
  </div>
</header>

<main>

  <!-- 人工智能 -->
  <section class="category">
    <h2>人工智能</h2>

    <div class="links">

      <a class="link-card"
         href="https://chatgpt.com"
         target="_blank">
        <h3>ChatGPT</h3>
        <p>人工智能对话和内容生成</p>
      </a>

      <a class="link-card"
         href="https://github.com"
         target="_blank">
        <h3>GitHub</h3>
        <p>代码托管和开源项目</p>
      </a>

      <a class="link-card"
         href="https://wkapi.club"
         target="_blank">
        <h3>悟空</h3>
        <p>api中转站</p>
      </a>

    </div>
  </section>

  <!-- 学习工具 -->
  <section class="category">
    <h2>学习工具</h2>

    <div class="links">

      <a class="link-card"
         href="https://www.bilibili.com"
         target="_blank">
        <h3>哔哩哔哩</h3>
        <p>课程、教程和视频学习</p>
      </a>

      <a class="link-card"
         href="https://scholar.google.com"
         target="_blank">
        <h3>Google Scholar</h3>
        <p>搜索学术论文</p>
      </a>

      <a class="link-card"
         href="https://www.icourse163.org/channel/2001.htm"
         target="_blank">
        <h3>中国大学mooc</h3>
        <p>刷课</p>
      </a>

      <a class="link-card"
         href="https://www.yuque.com/baicaigongchang1145haoyuangong/ib3g1e"
         target="_blank">
        <h3>机器学声</h3>
        <p>模拟人声</p>
      </a>
      
      
    </div>
  </section>

  <!-- 日常工具 -->
  <section class="category">
    <h2>日常工具</h2>

    <div class="links">

      <a class="link-card"
         href="https://mail.google.com"
         target="_blank">
        <h3>Gmail</h3>
        <p>电子邮件</p>
      </a>

      <a class="link-card"
         href="https://sso.unipus.cn/sso/login?service=https%3A%2F%2Fitestcloud.unipus.cn%2Futest%2Fitest%2Flogin%3F_rp%3D%252Fitest%252Fs%252Fexam"
         target="_blank">
        <h3>unipus</h3>
        <p>英语作业网站</p>
      </a>

      <a class="link-card"
         href="https://mail.google.com"
         target="_blank">
        <h3>Gmail</h3>
        <p>电子邮件</p>
      </a>


    </div>
  </section>

</main>

<footer>
  我的个人网址导航
</footer>

<script>
  const searchInput = document.getElementById("searchInput");
  const linkCards = document.querySelectorAll(".link-card");

  searchInput.addEventListener("input", function () {
    const keyword = this.value.toLowerCase().trim();

    linkCards.forEach(function (card) {
      const content = card.innerText.toLowerCase();

      if (content.includes(keyword)) {
        card.classList.remove("hidden");
      } else {
        card.classList.add("hidden");
      }
    });
  });
</script>

</body>
</html>
